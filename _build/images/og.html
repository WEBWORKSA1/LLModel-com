<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1200px;height:630px;background:#f4f6fb;font-family:Archivo,sans-serif;color:#1d1a33}
.wrap{position:relative;width:1200px;height:630px;box-sizing:border-box;padding:64px 72px;display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center}
.brand{display:flex;gap:6px;margin-bottom:34px}.tok{font-family:"Martian Mono",monospace;font-size:34px;font-weight:500;line-height:1;padding:14px 14px 12px;border-radius:12px}
.a{background:#440154;color:#fde725}.b{background:#fde725;color:#440154}
h1{font-size:68px;line-height:1.0;letter-spacing:-.03em;font-weight:800;font-stretch:112%;margin:0;max-width:11ch}
p{font-size:25px;line-height:1.4;color:#4e4968;margin:26px 0 0;max-width:30ch}
.panel{background:#fff;border:2px solid #d9ddea;border-radius:22px;padding:26px 26px 18px}
.prompt{font-family:"Martian Mono",monospace;font-size:21px;padding-bottom:16px;border-bottom:2px dashed #c3c8da;margin-bottom:14px}
.prompt span{background:#fde725;border-radius:5px;padding:0 4px}
.row{display:grid;grid-template-columns:150px 1fr 54px;gap:12px;align-items:center;font-family:"Martian Mono",monospace;font-size:16px;padding:7px 0}
.track{height:16px;background:#ebeef6;border-radius:4px;overflow:hidden}.bar{height:100%;border-radius:4px}
.num{text-align:right;color:#4e4968}
.url{position:absolute;left:72px;bottom:44px;font-size:22px;font-weight:600;color:#1a7470}
</style></head><body><div class="wrap"><div>
<div class="brand"><span class="tok a">LL</span><span class="tok b">Model</span></div>
<h1>The field guide to large language models</h1>
<p>Compare prices, context and licenses. Free calculators. Plain-English guides.</p>
</div><div class="panel">
<div class="prompt">I need a model for <span>coding</span></div>
<div class="row"><span>coding</span><span class="track"><span class="bar" style="display:block;width:100%;background:#440154"></span></span><span class="num">0.31</span></div>
<div class="row"><span>support</span><span class="track"><span class="bar" style="display:block;width:61%;background:#443983"></span></span><span class="num">0.19</span></div>
<div class="row"><span>long docs</span><span class="track"><span class="bar" style="display:block;width:48%;background:#31688e"></span></span><span class="num">0.15</span></div>
<div class="row"><span>offline</span><span class="track"><span class="bar" style="display:block;width:39%;background:#21918c"></span></span><span class="num">0.12</span></div>
<div class="row"><span>low cost</span><span class="track"><span class="bar" style="display:block;width:35%;background:#35b779"></span></span><span class="num">0.11</span></div>
<div class="row"><span>agents</span><span class="track"><span class="bar" style="display:block;width:26%;background:#90d743"></span></span><span class="num">0.08</span></div>
</div></div><div class="url">llmodel.com</div></body></html>
